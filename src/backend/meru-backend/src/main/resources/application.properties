spring.application.name=meru-backend
server.port=8080

# --- SEGURIDAD / KEYCLOAK ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/meru-app

# --- SWAGGER / OPENAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- CONFIGURACIÓN DE POSTGRESQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/meru_app
spring.datasource.username=postgres
spring.datasource.password=Hola123
spring.datasource.driver-class-name=org.postgresql.Driver

# --- CONFIGURACIÓN DE JPA / HIBERNATE ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Usamos 'validate' basándonos en tu skill: Hibernate validará que las entidades
# de Java coincidan con tus tablas, pero NO modificará tu base de datos.
spring.jpa.hibernate.ddl-auto=validate

# --- MERCADO PAGO (CHECKOUT PRO) ---
# Pegar aquí tu Access Token de Prueba (TEST-...) o definir la variable de entorno MP_ACCESS_TOKEN
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.sandbox=true
mercadopago.back-url.success=${MP_BACK_URL_SUCCESS:http://localhost:5173/pagos/exitoso}
mercadopago.back-url.failure=${MP_BACK_URL_FAILURE:http://localhost:5173/pagos/fallido}
mercadopago.back-url.pending=${MP_BACK_URL_PENDING:http://localhost:5173/pagos/pendiente}
mercadopago.notification-url=${MP_NOTIFICATION_URL:}
